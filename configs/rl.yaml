experiment_name: "rl_from_dagger_256_8_8"
base_save_dir: "runs"
overwrite: false              # delete the existing experiment dir on restart so RL begins fresh
reset_scheduler: false

# Model Architecture
embed_dim: 256
num_layers: 8
num_heads: 8
max_len: 196
block_size: 4096
use_packing: true
dropout: 0.1

# Phase 0: Dataset Generation
data_generation:
  enabled: false             # skip dataset generation for this RL-only config
  mode: "supervised"
  output_dir: "dataset"
  experiment_specific: false
  episodes: 300000
  workers: 18
  basic_only: false
  history_window: -1
  remote_clients: true
  timeout_safety_multiplier: 3.0
  min_depth: 1
  max_depth: 6

# Phase 1: Pre-training
pretrain:
  enabled: false             # skip pretrain and seed the actor from resume_from instead
  run_name: "pre_train"
  epochs: 20
  batch_size: 1024
  lr: 3e-4
  data_dir: "dataset"
  resume_from: "/home/aryan/projects/auxila/ariadne/runs/benchmark_256_8_8/dagger_iter_34/checkpoints/dagger_iter_34_best.pt"

# Phase 2: DAgger Loop
dagger:
  enabled: false             # skip DAgger entirely
  iterations: 35

  generation:
    episodes_per_iter: 15000
    workers: 8
    remote_clients: true
    history_window: -1
    max_corrections: 10
    max_steps_multiplier: 2.0
    allow_recovery_mistakes: true
    recoverable_mistake_rate: 0.5
    idle_timeout: 120
    timeout_safety_multiplier: 3.0
    min_depth: 1
    max_depth: [6, 6, 6, 7, 7, 7]

  training:
    epochs: 20
    batch_size: 1024
    lr: 3e-4
    lr_decay: 0.99
    expert_multiplier: 0.25
    decay_factor: 0.8

# Phase 3: Reinforcement Learning
rl:
  enabled: true
  iterations: 100
  resume_from: "/home/aryan/projects/auxila/ariadne/runs/benchmark_256_8_8/dagger_iter_34/checkpoints/dagger_iter_34_best.pt"  # frozen PPO reference policy; keep aligned with pretrain.resume_from for a clean restart

  rollout:
    episodes_per_iter: 1000     # total rollout episodes collected per PPO iteration
    workers: 8                  # number of parallel RL rollout workers
    remote_clients: true        # true = wait for external bridge clients, false = launch local clients
    max_steps_multiplier: 2.0   # terminate an episode after oracle_plan_len * multiplier steps
    idle_timeout: 120           # worker exits if no bridge requests arrive for this many seconds
    timeout_safety_multiplier: 3.0  # orchestrator timeout cushion over observed rollout rate
    step_bonus: 0.0             # reward for valid-prefix non-terminal actions; invalid steps get the opposite sign
    decode: "sample"            # rollout policy: "greedy", "sample", or "epsilon_greedy"
    temperature: 1.0            # sampling temperature; higher = more exploratory, lower = sharper
    top_k: 0                    # sample only from top-k actions (0 disables top-k filtering)
    top_p: 1.0                 # nucleus sampling cutoff; keep the smallest set of actions with cumulative prob <= top_p
    epsilon: 0.02               # random-action rate used only by "epsilon_greedy"
    min_depth: 1                # minimum oracle expression depth for rollout tasks
    max_depth: 7                # maximum oracle expression depth for rollout tasks

  training:
    lr: 1e-5
    lr_decay: 0.995             # multiplicative decay applied across RL iterations (iter-level)
    lr_warmup_steps: 5          # linear warm-up steps within one RL iteration (0 = disabled)
    lr_min_ratio: 0.05          # cosine floor: final LR = lr * lr_min_ratio
    gamma: 0.99                 # reward discount factor
    gae_lambda: 0.95            # GAE smoothing; lower = lower variance, higher = less bias
    ppo_epochs: 4               # number of passes over the same rollout batch
    minibatch_size: 64          # PPO minibatch size over flattened transitions
    clip_ratio: 0.2             # PPO ratio clipping threshold
    value_loss_coef: 0.5        # critic loss weight in the total objective
    entropy_coef: 0.001         # entropy bonus weight for exploration
    target_kl: 0.05             # early-stop threshold if PPO updates move too far in one iteration
    reference_kl_coef: 0.0      # optional penalty against the frozen seed/reference policy (0 disables it)
    max_grad_norm: 0.5          # gradient clipping threshold
    min_success_rate: 0.0       # skip PPO training if rollout success rate falls below this

# Phase 4: Evaluation
evaluation:
  enabled: true               # skip evaluation in this RL-only config
  checkpoint: "latest"
  suite: "standard"
  workers: 8
  base_port: 9000
  remote_clients: true
  headless: true
  decode_mode: "greedy"
  output_dir: "evaluation"
  max_steps_multiplier: 2.0
